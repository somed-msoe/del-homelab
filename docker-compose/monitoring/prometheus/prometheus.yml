global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node-exporter uses host networking, so reach it via the host gateway
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
    relabel_configs:
      - target_label: instance
        replacement: del-homelab

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

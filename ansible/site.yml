- name: Baseline homelab config
  hosts: homelab
  become: true
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [curl, git, restic]
        state: present
        update_cache: true

    - name: Mask sleep targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Media and data directories exist
      ansible.builtin.file:
        path: "/home/delsoro/{{ item }}"
        state: directory
        owner: delsoro
        group: delsoro
        mode: "0775"
      loop:
        - media/movies
        - media/shows
        - manga
        - music

    - name: Nightly backup cron (enable once /mnt/backup is mounted)
      ansible.builtin.cron:
        name: homelab nightly backup
        user: delsoro
        minute: "0"
        hour: "3"
        job: "/home/delsoro/homelab-infra/scripts/backup.sh >> /home/delsoro/backup.log 2>&1"
        disabled: true

- name: Baseline homelab config
  hosts: homelab
  become: true
  vars:
    # name = folder under /home/delsoro, src = folder under docker-compose/
    compose_stacks:
      - { name: gitea, src: gitea }
      - { name: gitea-runner, src: gitea/gitea-runner }
      - { name: jellyfin, src: jellyfin }
      - { name: komga, src: komga }
      - { name: minecraft, src: minecraft }
      - { name: navidrome, src: navidrome }
      - { name: uptime-kuma, src: uptime-kuma }
  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name: [curl, git, restic, python3.14-venv]
        state: present
        update_cache: true

    - name: Mask sleep targets
      ansible.builtin.systemd:
        name: "{{ item }}"
        masked: true
      loop:
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target

    - name: Media and data directories exist
      ansible.builtin.file:
        path: "/home/delsoro/{{ item }}"
        state: directory
        owner: delsoro
        group: delsoro
        mode: "0775"
      loop:
        - media/movies
        - media/shows
        - manga
        - music

    # The 03:00 UTC cron entry lives in root's crontab and is not managed here.
    - name: Nightly restic backup script
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/homelab-backup.sh"
        dest: /usr/local/bin/homelab-backup.sh
        owner: root
        group: root
        mode: "0755"

    - name: Login banner
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../scripts/motd/01-delsoro-banner"
        dest: /etc/update-motd.d/01-delsoro-banner
        owner: root
        group: root
        mode: "0755"

    # Ubuntu's stock login messages (help links, sysinfo, ads, update counts).
    # Package upgrades can restore the exec bit; re-run the playbook if they return.
    - name: Find stock login message scripts
      ansible.builtin.find:
        paths: /etc/update-motd.d
        file_type: any
        excludes: ["00-header", "01-delsoro-banner"]
      register: stock_motd

    - name: Disable stock login message scripts
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: "0644"
      loop: "{{ stock_motd.files }}"
      loop_control:
        label: "{{ item.path }}"

    - name: Stack directories exist
      ansible.builtin.file:
        path: "/home/delsoro/{{ item.name }}"
        state: directory
        owner: delsoro
        group: delsoro
        mode: "0775"
      loop: "{{ compose_stacks }}"
      tags: compose

    - name: Compose files match the repo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose/{{ item.src }}/docker-compose.yml"
        dest: "/home/delsoro/{{ item.name }}/docker-compose.yml"
        owner: delsoro
        group: delsoro
        mode: "0644"
      loop: "{{ compose_stacks }}"
      register: compose_files
      tags: compose

    # up -d is a no-op when nothing differs, so this only recreates what changed
    - name: Apply changed stacks
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: "/home/delsoro/{{ item.item.name }}"
      become_user: delsoro
      loop: "{{ compose_files.results }}"
      loop_control:
        label: "{{ item.item.name }}"
      when: item.changed
      changed_when: true
      tags: compose

    - name: Monitoring .env exists (holds the Grafana password, not in git)
      ansible.builtin.stat:
        path: /home/delsoro/monitoring/.env
      register: monitoring_env
      tags: compose

    - name: Fail if monitoring .env is missing
      ansible.builtin.fail:
        msg: "Create /home/delsoro/monitoring/.env from docker-compose/monitoring/.env.example first"
      when: not monitoring_env.stat.exists
      tags: compose

    - name: Monitoring files match the repo
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../docker-compose/monitoring/"
        dest: /home/delsoro/monitoring/
        owner: delsoro
        group: delsoro
        directory_mode: "0755"
        mode: "0644"
      register: monitoring_files
      tags: compose

    - name: Apply monitoring stack
      ansible.builtin.command:
        cmd: docker compose up -d
        chdir: /home/delsoro/monitoring
      become_user: delsoro
      when: monitoring_files.changed
      changed_when: true
      tags: compose

    # homelab-mcp is not a service: Claude Desktop launches it over SSH (stdio).
    # Docs in docs/notes.md. The Jellyfin key is added by hand, never via git.
    - name: homelab-mcp checkout from Gitea
      ansible.builtin.git:
        repo: "gitea:delsoro/homelab-mcp.git"
        dest: /home/delsoro/homelab-mcp
        version: main
        accept_newhostkey: true
      become_user: delsoro
      register: mcp_repo
      tags: mcp

    - name: homelab-mcp venv exists
      ansible.builtin.command:
        cmd: python3 -m venv .venv
        chdir: /home/delsoro/homelab-mcp
        creates: /home/delsoro/homelab-mcp/.venv/bin/python
      become_user: delsoro
      register: mcp_venv
      tags: mcp

    - name: Install homelab-mcp into the venv
      ansible.builtin.command:
        cmd: .venv/bin/pip install -e .
        chdir: /home/delsoro/homelab-mcp
      become_user: delsoro
      when: mcp_repo.changed or mcp_venv.changed
      changed_when: true
      tags: mcp

    - name: homelab-mcp config and audit directories
      ansible.builtin.file:
        path: "/home/delsoro/{{ item }}"
        state: directory
        owner: delsoro
        group: delsoro
        mode: "0700"
      loop:
        - .config/homelab-mcp
        - .homelab-mcp
      tags: mcp

    # force: false creates an empty placeholder once and never overwrites the real file
    - name: homelab-mcp env file exists (holds JELLYFIN_API_KEY, not in git)
      ansible.builtin.copy:
        content: ""
        dest: /home/delsoro/.config/homelab-mcp/env
        owner: delsoro
        group: delsoro
        mode: "0600"
        force: false
      tags: mcp

    - name: Check the Jellyfin key is set (value is never printed)
      ansible.builtin.command:
        cmd: grep -q '^JELLYFIN_API_KEY=.' /home/delsoro/.config/homelab-mcp/env
      become_user: delsoro
      register: mcp_key
      failed_when: false
      changed_when: false
      check_mode: false
      tags: mcp

    - name: Warn if the Jellyfin key is missing
      ansible.builtin.debug:
        msg: >-
          JELLYFIN_API_KEY is empty. Fill it in on the server with:
          read -rs k && printf 'JELLYFIN_API_KEY=%s\n' "$k" > ~/.config/homelab-mcp/env
      when: mcp_key.rc != 0
      tags: mcp
